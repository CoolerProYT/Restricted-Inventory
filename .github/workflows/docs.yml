# Builds the VitePress wiki in docs/ and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Docs

# Pushes to the repository's default branch that touch the wiki rebuild and redeploy it. The branch is
# not named here: the build job compares the pushed ref against the repository's own default branch,
# so renaming it (or making a new version branch the default) needs no change to this file.
# A manual run deploys whatever branch it is started from.
on:
  push:
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      # Builds for https://<user>.github.io/Restricted-Inventory/. When a custom (sub)domain is set up
      # in the Pages settings, add `env: DOCS_BASE: /` here so the site is served from the root.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
